# ── Gmail 邮件端口：直连 ──────────────────────────────────────
# 住宅代理线路会丢弃 Gmail 的邮件端口（993/465/587/995），直连可通。
DOMAIN,imap.gmail.com,DIRECT
DOMAIN,smtp.gmail.com,DIRECT
DOMAIN,pop.gmail.com,DIRECT

# ── 需要走代理的单个域名 ──────────────────────────────────────
# ndhixj.cn 的图床解析到国内 CDN，直连会 TLS 重置，所以走节点
# （和 Mac 上 Clash 那条 DOMAIN-SUFFIX,ndhixj.cn,PROXY 对应）。
DOMAIN-SUFFIX,ndhixj.cn,🌏全球低延迟
# 百度网盘登录壳直连超时、节点可达。
DOMAIN,pan.baidu.com,🌏全球低延迟

# ── 国内与校园直连 ────────────────────────────────────────────
# Steam 取 CM 列表的接口和结算页在小火箭上必须直连。
# 走节点时 TLS 会被重置，客户端拿不到服务器列表，一直重连。
