# Clash 规则覆写层（Clash Verge 的 "规则" / Clash Meta 的 rule 覆写）
#
# 用法：在客户端里把这份文件作为订阅的「规则覆写」挂上去。
# prepend 里的规则永远插在订阅自带规则之前，因此订阅更新不会冲掉它们。

prepend:
  # ── Steam ───────────────────────────────────────────────────────
  # 住宅代理出口对这两个 SNI 会直接重置 TLS（同一节点上 store / login /
  # community 都正常），Steam 因此取不到 CM 列表，卡在重连循环。
  # 两者直连实测可用，必须排在 steampowered.com 的 PROXY 规则之前。
  - 'DOMAIN,api.steampowered.com,DIRECT'
  - 'DOMAIN,checkout.steampowered.com,DIRECT'
  # 商店、社区等网页保持代理；登录服务器走直连。
  # 当前住宅代理的 Steam 270xx 端口实测失败，直连可通。
  - 'DOMAIN-SUFFIX,steampowered.com,PROXY'
  - 'DOMAIN-SUFFIX,steamcommunity.com,PROXY'
  - 'DOMAIN-SUFFIX,steamstatic.com,PROXY'
  - 'DOMAIN-SUFFIX,steamserver.net,DIRECT'
  - 'DOMAIN-SUFFIX,steamcontent.com,PROXY'
  - 'DOMAIN-SUFFIX,steamusercontent.com,PROXY'
  - 'DOMAIN-SUFFIX,steam-chat.com,PROXY'
  - 'DOMAIN-SUFFIX,steamgames.com,PROXY'
  - 'DOMAIN-SUFFIX,steam.tv,PROXY'
  - 'DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,PROXY'
  - 'DOMAIN-SUFFIX,steamstore-a.akamaihd.net,PROXY'

  # ── Epic / hCaptcha ─────────────────────────────────────────────
  # 认证和 CAPTCHA 依赖同一条直连路径，避免验证初始化失败。
  - 'DOMAIN-SUFFIX,epicgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,epicgames.dev,DIRECT'
  - 'DOMAIN-SUFFIX,unrealengine.com,DIRECT'
  - 'DOMAIN-SUFFIX,hcaptcha.com,DIRECT'
  - 'DOMAIN-SUFFIX,featureassets.org,DIRECT'
  - 'DOMAIN-SUFFIX,prodregistryv2.org,DIRECT'

  # ── WorkBuddy / CodeBuddy ───────────────────────────────────────
  # 登录、遥测和插件市场走代理曾超时；只覆盖这些产品域名。
  - 'DOMAIN-SUFFIX,workbuddy.ai,DIRECT'
  - 'DOMAIN-SUFFIX,workbuddy.cn,DIRECT'
  - 'DOMAIN-SUFFIX,codebuddy.ai,DIRECT'
  - 'DOMAIN-SUFFIX,tgalileo.com,DIRECT'
  - 'DOMAIN-SUFFIX,cnb.cool,DIRECT'

  # ── 百度网盘 ────────────────────────────────────────────────────
  # 登录主机直连超时、代理可达，只覆盖这个主机。
  - 'DOMAIN,pan.baidu.com,PROXY'

  # ── Texas Poker ────────────────────────────────────────────────
  # 桌面游戏连接裸 IP 服务器时，住宅代理会断，按进程直连。
  - 'PROCESS-NAME,Texas Poker,DIRECT'

  # ── Gmail 邮件端口 ──────────────────────────────────────────────
  # 住宅代理线路会丢弃 Gmail 的邮件端口（993/465/587/995），
  # 表现为 Mail.app 弹 "SSL error"。这几个域名直连可通，故走 DIRECT。
  - 'DOMAIN,imap.gmail.com,DIRECT'
  - 'DOMAIN,smtp.gmail.com,DIRECT'
  - 'DOMAIN,pop.gmail.com,DIRECT'

  # ── 需要强制走代理的 ────────────────────────────────────────────
  # 文章页图床解析到国内 CDN，订阅里的 cn DIRECT 规则会让它走本地网络，
  # 结果 TLS 被重置，因此强制走节点。
  - 'DOMAIN-SUFFIX,ndhixj.cn,PROXY'

  # ── Siri / Apple Intelligence ───────────────────────────────────
  # 只让 Apple 官方列出的 Siri、搜索和私有云计算主机走代理。
  - 'DOMAIN,guzzoni.apple.com,PROXY'
  - 'DOMAIN-SUFFIX,smoot.apple.com,PROXY'
  - 'DOMAIN,apple-relay.cloudflare.com,PROXY'
  - 'DOMAIN,apple-relay.fastly-edge.com,PROXY'
  - 'DOMAIN,cp4.cloudflare.com,PROXY'
  - 'DOMAIN,apple-relay.apple.com,PROXY'

  # ── 网易云音乐 ──────────────────────────────────────────────────
  # 含 Helper 进程的媒体下载，全部走直连，不受订阅规则影响。
  - 'PROCESS-NAME,NeteaseMusic,DIRECT'
  - 'PROCESS-NAME,NeteaseMusic Helper,DIRECT'
  - 'DOMAIN-SUFFIX,music.163.com,DIRECT'
  - 'DOMAIN-SUFFIX,music.126.net,DIRECT'

  # ── 豆包输入法 / 字节系 ─────────────────────────────────────────
  - 'PROCESS-NAME,DoubaoIme,DIRECT'
  - 'PROCESS-NAME,DoubaoImeSettings,DIRECT'
  - 'PROCESS-NAME,DoubaoImeUpdater,DIRECT'
  - 'DOMAIN-SUFFIX,doubao.com,DIRECT'
  - 'DOMAIN-SUFFIX,snssdk.com,DIRECT'
  - 'DOMAIN-SUFFIX,isnssdk.com,DIRECT'
  - 'DOMAIN-SUFFIX,byteimg.com,DIRECT'
  - 'DOMAIN-SUFFIX,ibyteimg.com,DIRECT'
  - 'DOMAIN-SUFFIX,bytescm.com,DIRECT'
  - 'DOMAIN-SUFFIX,bytetcc.com,DIRECT'
  - 'DOMAIN-SUFFIX,ibytedapm.com,DIRECT'
  - 'DOMAIN-SUFFIX,zijieapi.com,DIRECT'
  - 'DOMAIN-SUFFIX,volces.com,DIRECT'
  - 'DOMAIN-SUFFIX,bytedanceapi.com,DIRECT'
  - 'DOMAIN-SUFFIX,typeless.com,DIRECT'
  - 'DOMAIN-SUFFIX,typeless-static.com,DIRECT'

  # ── App Store ───────────────────────────────────────────────────
  # 走代理时 App Store 下载/校验异常，全部直连。
  - 'PROCESS-NAME,App Store,DIRECT'
  - 'PROCESS-NAME,appstored,DIRECT'
  - 'PROCESS-NAME,storeaccountd,DIRECT'
  - 'PROCESS-NAME,storedownloadd,DIRECT'
  - 'PROCESS-NAME,storeassetd,DIRECT'
  - 'GEOSITE,apple,DIRECT'

  # ── 本机规则合并（2026-10-07）───────────────────────────────────
  # 通用代理使用 PROXY；Mac 同步脚本保留本机 AI 美国节点选择。
  - 'PROCESS-NAME,ToDesk,DIRECT'
  - 'PROCESS-NAME,ToDesk_Service,DIRECT'
  - 'PROCESS-NAME,ToDesk_Session,DIRECT'
  - 'PROCESS-NAME,ToDesk_Session_Proxy,DIRECT'
  - 'PROCESS-NAME,ToDesk_XPCHelper,DIRECT'
  - 'PROCESS-NAME,ToDesk_Screenwall_Helper,DIRECT'
  - 'DOMAIN-SUFFIX,auth.openai.com,PROXY'
